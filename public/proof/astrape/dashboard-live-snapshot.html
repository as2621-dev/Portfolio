  Real product capture — NOT a mockup.
  Source: the deployed Astrape Google Apps Script web app
  (appsscript/Index.html served by doGet, access: anyone with the link).
  Captured 2026-08-02 via headless Chrome as a static DOM snapshot:
  scripts removed, Chart.js canvas frozen to a PNG data URI. No other edits.

<!DOCTYPE html>
<html style="--accent: #19e6a4; --glow: rgba(25,230,164,0.1);"><head>


  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e15">
  <title>Electricity Dashboard</title>
  <style>
    :root {
      --bg: #0a0e15;
      --ink: #e9eef5;
      --muted: #7c8a9c;
      --faint: #54607180;
      --grid: rgba(255, 255, 255, 0.06);
      --card: rgba(255, 255, 255, 0.035);
      --card-border: rgba(255, 255, 255, 0.08);
      --good: #19e6a4;
      --warn: #ffb020;
      --bad: #ff5c5c;
       
      --accent: #19e6a4;
      --glow: rgba(25, 230, 164, 0.10);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
     
    html { height: 100vh; height: 100svh; background: var(--bg); }
    body {
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(125% 65% at 50% -5%, var(--glow), transparent 60%),
        var(--bg);
      display: flex;
      flex-direction: column;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: "SF Mono", ui-monospace, "Roboto Mono", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

     
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand .bolt { color: var(--accent); font-size: 14px; }
    .live {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--glow);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .live.show { display: inline-flex; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
     
    .cycle-select {
      appearance: none;
      -webkit-appearance: none;
      background-color: var(--card);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237c8a9c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 11px center;
      border: 1px solid var(--card-border);
      border-radius: 999px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 7px 30px 7px 14px;
      line-height: 1;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .cycle-select:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
     
    .cycle-select option { background: #0a0e15; color: #e9eef5; }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .refresh-btn:active {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .refresh-btn:disabled { opacity: 0.5; cursor: default; }
    .refresh-icon { display: inline-block; font-size: 14px; line-height: 1; }
    .refresh-btn.spinning .refresh-icon { animation: spin 0.9s linear infinite; }
    .live .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.7s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--glow); }
      50%      { opacity: 0.35; box-shadow: 0 0 0 5px transparent; }
    }

     
    .panel {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 16px 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

     
    .panel-head {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .head-right {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .head-right .mono { color: var(--muted); font-size: 11px; }
    .hero { flex: 1 1 auto; min-width: 0; }
    .hero-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .hero-headline {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin-top: 2px;
    }
    .hero-num-wrap {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
    }
    .hero-num {
      font-size: clamp(26px, 7vw, 42px);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      color: var(--ink);
    }
    .hero-unit { font-size: 14px; font-weight: 600; color: var(--muted); }
    .hero-dollars { font-size: 15px; font-weight: 600; color: var(--muted); }
    .hero-dollars b { color: var(--ink); font-weight: 700; }
    .hero-pills {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .delta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.2px;
    }
    .delta.good { color: var(--good); background: rgba(25, 230, 164, 0.12); }
    .delta.bad  { color: var(--bad);  background: rgba(255, 92, 92, 0.12); }
    .sofar { font-size: 13px; color: var(--muted); }
    .sofar b { color: var(--ink); font-weight: 600; }

     
    .chart-wrap {
      flex: 1 1 auto;
      position: relative;
      min-height: 200px;
      margin: 12px 0 6px;
    }
    .legend {
      flex: 0 0 auto;
      display: flex;
      gap: 16px;
      justify-content: center;
      font-size: 12px;
      color: var(--muted);
      padding: 8px 0 2px;
      background: var(--bg);
      border-top: 1px solid var(--card-border);
      margin-top: 6px;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 16px; height: 0; border-top: 3px solid var(--accent); border-radius: 2px; }
    .swatch.dotted { border-top-style: dotted; border-color: var(--accent); border-top-width: 3px; }
    .swatch.band {
      height: 9px; border-top: none; border-radius: 2px;
      background: rgba(255, 193, 7, 0.18);
      border: 1px solid rgba(184, 134, 11, 0.65);
    }

     
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent);
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--glow);
      border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    }
    .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

     
    .center-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--muted);
      font-size: 15px;
      text-align: center;
      padding: 0 18px;
    }
    .spinner {
      width: 26px; height: 26px;
      border: 3px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

     
    @media (max-height: 500px) {
      body {
         
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .topbar { margin-bottom: 4px; padding: 0 8px; }
      .panel { border-radius: 0; padding: 8px 10px 6px; border-left: 0; border-right: 0; }
      .hero-label { display: none; }
      .hero-num { font-size: clamp(22px, 5vw, 30px); }
      .hero-unit { font-size: 12px; }
      .hero-headline { gap: 2px 10px; margin-top: 0; }
      .hero-pills { gap: 3px; }
      .delta, .status-pill { font-size: 11px; padding: 2px 8px; }
      .sofar { font-size: 11.5px; }
      .chart-wrap { margin: 6px 0 2px; min-height: 120px; }
      .legend { padding: 4px 0 0; margin-top: 2px; font-size: 11px; gap: 12px; }
      .head-right .mono { display: none; }
    }

     
    @media (max-width: 560px) {
      body {
        padding:
          max(8px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          max(8px, env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
      }
      .topbar { margin-bottom: 8px; }
      .panel { border-radius: 14px; padding: 12px 12px 8px; }
      .head-right .mono { display: none; }
      .hero-num { font-size: clamp(24px, 8vw, 32px); }
      .hero-unit { font-size: 12px; }
      .hero-headline {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .hero-pills {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
      }
      .sofar { font-size: 12px; }
      .legend { gap: 12px; font-size: 11.5px; }
    }
  </style>
</head>
